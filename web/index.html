<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, initial-scale=1">
<title>HOME//OS</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="intro">
<div id="stage">

  <div class="lines" aria-hidden="true">
    <i class="v" style="left:48px"></i><i class="v" style="left:488px"></i>
    <i class="v" style="left:968px;height:88px"></i><i class="v" style="left:968px;top:808px;height:60px"></i>
    <i class="v" style="left:1368px"></i><i class="v" style="left:1872px"></i>
    <i class="h" style="top:88px"></i><i class="h" style="top:430px"></i><i class="h" style="top:808px"></i>
    <i class="h" style="top:868px"></i><i class="h" style="top:1040px"></i>
  </div>
  <div class="ruler-l" aria-hidden="true"></div>
  <div class="ruler-b" aria-hidden="true"><span style="left:4px">0</span><span style="left:484px">400</span><span style="left:964px">800</span><span style="left:1444px">1200</span></div>
  <div aria-hidden="true">
    <i class="cross" style="left:488px;top:88px"><i></i></i><i class="cross" style="left:1368px;top:88px"><i></i></i>
    <i class="cross" style="left:488px;top:430px"><i></i></i><i class="cross" style="left:1368px;top:430px"><i></i></i>
    <i class="cross" style="left:488px;top:808px"><i></i></i><i class="cross" style="left:1368px;top:808px"><i></i></i>
    <span class="ref" style="left:58px;top:96px">A·01</span><span class="ref" style="left:58px;top:438px">B·01</span>
    <span class="ref" style="left:498px;top:438px">B·02</span><span class="ref" style="right:58px;top:96px">SHEET 1/1 · SCALE 1:1</span>
  </div>

  <header id="top">
    <div class="cell brand"><span class="dots"><i></i><i></i><i></i><i></i></span><b>HOME//OS</b></div>
    <div class="cell date"><span id="date">---</span><span id="weather" class="weather"></span></div>
    <div class="cell status"><i class="ok"></i>NO ADS / NO TRACKING</div>
    <div class="cell right"><span id="clock">--:--</span><button id="settingsBtn" class="chamfer">SETTINGS</button></div>
  </header>

  <div id="hero"><h1 id="heroName">YOUTUBE</h1></div>
  <div id="heroMeta"><span>NOW FOCUSED</span><span id="heroKind" class="hue">VIDEO</span><span>PRESS OK TO OPEN</span></div>

  <figure id="photoCell">
    <div id="photo" class="photo"><span id="photoLabel">[ARCHIVAL PHOTO]</span></div>
    <figcaption id="photoCredit">FIG. 01</figcaption>
  </figure>

  <section id="history">
    <span class="label"><i class="sq"></i><span id="histLabel">WORKERS’ HISTORY</span></span>
    <span id="histYear" class="year hue">----</span>
    <p id="histText"></p>
  </section>

  <figure id="quote">
    <blockquote id="quoteText"></blockquote>
    <figcaption><i class="sq"></i><span id="quoteBy"></span></figcaption>
  </figure>

  <div id="strip">
    <span class="lbl">APPS + INPUTS:</span>
    <span id="toast"></span>
    <span class="arrows"><i id="arrL" class="arr">&#9664;</i><i id="arrR" class="arr">&#9654;</i></span>
  </div>

  <nav id="rail"><div id="track"></div></nav>

  <div id="settings">
    <div class="panel">
      <h2>SETTINGS</h2>
      <div id="settingsRows"></div>
      <p class="hint">▲ ▼ PICK A ROW · ◀ ▶ CHANGE · BACK TO CLOSE</p>
    </div>
  </div>

  <div id="saver">
    <div id="artA" class="art"></div>
    <div id="artB" class="art"></div>
    <div id="saverInfo"><span id="saverClock">--:--</span><span id="saverCaption"></span></div>
  </div>
</div>
<script src="history.js"></script>
<script src="sound.js"></script>
<script src="tv.js"></script>
<script src="app.js"></script>
</body>
</html>
